# Loaded from \EFI\EutherBoot\eutherboot.toml on EutherBoot's own volume.
# Example for the disposable QEMU environment; not a host OS configuration.
[boot]
default = "test"
timeout = 0
# Zero waits indefinitely. Any key cancels a positive timeout.
theme = "system-regis"

[[entry]]
id = "test"
name = "EFI test application"
type = "efi"
path = '\EFI\EutherBoot\TestChild.efi'
