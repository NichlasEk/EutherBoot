[package]
name = "eutherboot"
version = "0.1.2"
edition = "2024"
license.workspace = true

[dependencies]
boot-core = { path = "../boot-core" }
uefi = { version = "0.40", features = ["alloc", "global_allocator", "panic_handler"] }
uefi-raw = "0.16"
font8x8 = { version = "0.3", default-features = false, features = ["unicode"] }

[features]
qemu-debug = []
test-faults = ["qemu-debug"]
