# Example for eutherbootctl install --arch. These UKIs are generated by that
# explicitly installed integration; paths are not assumptions about other ESPs.
[boot]
default = "linux"
timeout = 5
theme = "system-regis"

[[entry]]
id = "linux"
name = "Arch Linux"
type = "efi"
path = '\EFI\EutherBoot\kernels\linux.efi'

[[entry]]
id = "linux-lts"
name = "Arch Linux LTS"
type = "efi"
path = '\EFI\EutherBoot\kernels\linux-lts.efi'

[[entry]]
id = "previous"
name = "Previous Arch kernel"
type = "efi"
path = '\EFI\EutherBoot\kernels\linux-previous.efi'

[[entry]]
id = "lts-previous"
name = "Previous LTS kernel"
type = "efi"
path = '\EFI\EutherBoot\kernels\linux-lts-previous.efi'
